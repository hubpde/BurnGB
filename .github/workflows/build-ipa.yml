name: Build & Package iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the IPA'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build BurnGB IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App for iOS (Release)
        run: |
          xcodebuild build \
            -project BurnGB.xcodeproj \
            -scheme BurnGB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "BurnGB.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: BurnGB.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          mkdir -p output/Payload
          cp -r "$APP_PATH" output/Payload/

          # Ad-hoc sign the bundle and any embedded appex/frameworks
          codesign --force --deep --sign - output/Payload/BurnGB.app || true

          cd output
          zip -r -9 BurnGB.ipa Payload
          cd ..

          ls -lh output/BurnGB.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BurnGB.ipa
          path: output/BurnGB.ipa
          if-no-files-found: error

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output/BurnGB.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
