name: Build, Test & Package BurnGB

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: burngb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 26 build and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d BurnGB.xcodeproj
          xcodebuild -project BurnGB.xcodeproj -list

      - name: Build for testing with Swift 6 strict concurrency
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build-for-testing \
            -project BurnGB.xcodeproj \
            -scheme BurnGB \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=complete \
            | tee ./xcodebuild-test.log

      - name: Archive for device
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -project BurnGB.xcodeproj \
            -scheme BurnGB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./output/BurnGB.xcarchive \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=complete \
            | tee ./xcodebuild-archive.log

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="./output/BurnGB.xcarchive/Products/Applications/BurnGB.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/BurnGBWidget.appex"
          test -f "$APP_PATH/Info.plist"

          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "App identifier: $APP_IDENTIFIER"
          test "$APP_IDENTIFIER" = "com.hubpde.BurnGB"

          mkdir -p ./output/Payload
          ditto "$APP_PATH" ./output/Payload/BurnGB.app
          (
            cd ./output
            /usr/bin/zip -r -9 BurnGB.ipa Payload
          )
          test -s ./output/BurnGB.ipa
          unzip -l ./output/BurnGB.ipa | grep -F 'Payload/BurnGB.app/PlugIns/BurnGBWidget.appex/'
          ls -lh ./output/BurnGB.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BurnGB-unsigned-ipa-${{ github.run_number }}
          path: output/BurnGB.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BurnGB-build-diagnostics-${{ github.run_number }}
          path: |
            xcodebuild-test.log
            xcodebuild-archive.log
            output/BurnGB.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 14
