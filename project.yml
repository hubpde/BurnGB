name: BurnGB

options:
  bundleIdPrefix: com.hubpde
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "2.0.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages: {}

schemes:
  BurnGB:
    build:
      targets:
        BurnGB: all
        BurnGBWidget: all
        BurnGBTests: test
    test:
      config: Debug
      targets:
        - name: BurnGBTests

targets:
  BurnGBCore:
    type: library.static
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BurnGBCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  BurnGB:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BurnGB
    resources:
      - path: BurnGB/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB
        INFOPLIST_FILE: BurnGB/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BurnGB/Resources/BurnGB.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: BurnGBCore
      - target: BurnGBWidget
        embed: true

  BurnGBWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BurnGBWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB.Widget
        INFOPLIST_FILE: BurnGBWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BurnGBWidget/BurnGBWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: BurnGBCore

  BurnGBTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BurnGBTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BurnGB.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BurnGB"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: BurnGB
      - target: BurnGBCore
