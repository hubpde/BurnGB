name: BurnGB
options:
  bundleIdPrefix: com.hubpde
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  BurnGB:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BurnGB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB
        INFOPLIST_FILE: BurnGB/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BurnGB/Resources/BurnGB.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: BurnGBWidget

  BurnGBWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BurnGBWidget
      - path: BurnGB/Models/BurnActivityAttributes.swift
      - path: BurnGB/Models/BurnNode.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubpde.BurnGB.Widget
        INFOPLIST_FILE: BurnGBWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
